# Deploy the exact immutable official build accepted by native-review.yml.
name: Promote verified native GunCat Web build to Pages
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Review native GunCat with official LayaAir 3.4 (no deployment)']
    branches: [main]
    types: [completed]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: guncat-pages-production
  cancel-in-progress: true
jobs:
  promote:
    # This one pinned review only; failed, superseded and fork runs cannot deploy.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.id == 40047814620 && github.event.workflow_run.head_sha == '9b5fc3263e0d03f45d8fe32af4a3445d2554fc0c' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    env:
      GUNCAT_PROMOTION_SOURCE: 288f385a6845ad5415029fce99b9b7c256b71f31
      REVIEW_RUN_ID: 40047814620
      REVIEW_HEAD_SHA: 9b5fc3263e0d03f45d8fe32af4a3445d2554fc0c
    steps:
      - uses: actions/checkout@v4
        with:
          repository: BaiMaGod/qiangshoumaomisoudache
          ref: 288f385a6845ad5415029fce99b9b7c256b71f31
          token: ${{ secrets.GUNCAT_SOURCE_READ_TOKEN }}
          path: private-game
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve the unique accepted artifact from this exact pinned review
        working-directory: private-game
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'NODE'
          import {appendFileSync} from 'node:fs';
          import {acceptedArtifact} from './tools/release/promotion-guards.mjs';
          const repository=process.env.GITHUB_REPOSITORY,runId=Number(process.env.REVIEW_RUN_ID),headSha=process.env.REVIEW_HEAD_SHA;
          async function get(path){const r=await fetch('https://api.github.com/repos/'+repository+path,{headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json'}});if(!r.ok)throw Error('Pinned review HTTP '+r.status);return r.json();}
          const run=await get('/actions/runs/'+runId),list=await get('/actions/runs/'+runId+'/artifacts?per_page=100');
          const candidates=list.artifacts.filter(a=>a.name==='guncat-native-verified-web'&&!a.expired);
          if(candidates.length!==1)throw Error('One unique accepted artifact required');
          const artifact=acceptedArtifact(run,list.artifacts,{repository,runId,headSha,artifactId:candidates[0].id});
          if(!Number.isSafeInteger(artifact.id)||artifact.id<=0)throw Error('Invalid artifact identity');
          appendFileSync(process.env.GITHUB_ENV,'REVIEW_ARTIFACT_ID='+artifact.id+'\n');
          console.log('PINNED_ACCEPTED_ARTIFACT',runId,artifact.id,headSha);
          NODE
      - name: Verify immutable successful review and accepted artifact identity
        id: review
        working-directory: private-game
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/release/verify-review-run.mjs
      - name: Download that exact verified official Web package
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.review.outputs.artifact_id }}
          run-id: 40047814620
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: private-game/.release-out/web
      - name: Recheck source identity, all native proof and every compiled file hash
        working-directory: private-game
        run: node tools/release/verify-promotion.mjs
      - name: Upload only the accepted Web package to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          name: guncat-pages-${{ github.run_attempt }}
          path: private-game/.release-out/web
      - name: Deploy verified native Web package
        id: publish
        uses: actions/deploy-pages@v4
        with:
          artifact_name: guncat-pages-${{ github.run_attempt }}
      - name: Verify live source and critical runtime bytes
        working-directory: private-game
        env:
          GUNCAT_LIVE_URL: ${{ steps.publish.outputs.page_url }}
        run: |
          python - <<'PY'
          import hashlib,json,os,time,urllib.request,urllib.error
          from pathlib import Path
          version=os.environ['GUNCAT_PROMOTION_SOURCE'];base=os.environ['GUNCAT_LIVE_URL'].rstrip('/')+'/'
          def fetch(path):
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(base+path+'?accepted='+version,timeout=45) as r:return r.read()
                  except urllib.error.HTTPError as e:
                      if e.code not in [404,429,500,502,503,504] or attempt==5:raise
                  except urllib.error.URLError:
                      if attempt==5:raise
                  time.sleep(5)
          local=json.loads(Path('.release-out/web/_build-evidence.json').read_text())
          for attempt in range(12):
              remote=json.loads(fetch('_build-evidence.json'))
              if remote['sourceCommit']==version:break
              time.sleep(5)
          else:raise AssertionError('Live source does not match the accepted build')
          names={'index.html','js/index.js','js/guncat-game.js','art-review/native-release.json','art-review/native-performance.json','art-review/complete-v8.json'}
          names.update(f['path'] for f in local['files'] if f['path'].startswith(('libs/','assets/packed-v9/')) or f['path'].startswith('assets/art/terrain-') or f['path'].endswith('.woff'))
          files={f['path']:f for f in local['files']}
          for path in sorted(names):
              data=fetch(path);assert len(data)==files[path]['bytes'] and hashlib.sha256(data).hexdigest()==files[path]['sha256'],path
          print('LIVE_ACCEPTED_SOURCE',version)
          print('LIVE_ACCEPTED_RUNTIME_HASHES',len(names))
          PY
      - name: Install real browser for live interaction verification
        run: |
          python -m pip install playwright==1.55.0 Pillow
          python -m playwright install --with-deps chromium
      - name: Play the deployed game in two viewports and all three maps
        working-directory: private-game
        env:
          GUNCAT_LIVE_URL: ${{ steps.publish.outputs.page_url }}
          GUNCAT_SOFTWARE_MODE: webgl-fallback
        run: GUNCAT_HEADED=1 xvfb-run -a -s '-screen 0 1920x1080x24' python tools/qa/live-native.py
      - name: Retain live screenshots and interaction results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guncat-live-native-verification
          path: private-game/qa-evidence/live-native/
          if-no-files-found: warn
