# V5: existing enemy gait and actual hit/defeat presentation; all original release gates retained.
name: Build private GunCat with LayaAir 3.4 and publish Pages
on:
  workflow_dispatch:
  # Editing this workflow retriggers deployment for the pinned private feature commit.
  # Deployment still requires ALL build + real browser gates to pass.
  push:
    branches: [main]
    paths:
      - '.github/workflows/game-release.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: guncat-pages-production
  cancel-in-progress: false
jobs:
  # Pin a complete private feature commit; do not check out raw source into public repository.
  verify-build-and-deploy:
    name: Real Laya build → mobile browser QA → Pages
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Require read-only private source token
        shell: bash
        env:
          SOURCE_READ_TOKEN: ${{ secrets.GUNCAT_SOURCE_READ_TOKEN }}
        run: |
          if [ -z "$SOURCE_READ_TOKEN" ]; then
            echo "::error::Add GUNCAT_SOURCE_READ_TOKEN to this public preview repository's Actions secrets. Token must only have Contents: Read access to BaiMaGod/qiangshoumaomisoudache. Never paste it in logs or chat."
            exit 1
          fi
      - name: Checkout PRIVATE game source (never commit it here)
        uses: actions/checkout@v4
        with:
          repository: BaiMaGod/qiangshoumaomisoudache
          ref: fb5ba72f4d170a39091e9bae754de4dbba70f961
          fetch-depth: 0
          token: ${{ secrets.GUNCAT_SOURCE_READ_TOKEN }}
          path: private-game
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: TypeScript and domain/map/release guard tests
        working-directory: private-game
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Install official LayaAir CLI 3.4.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/layabox/layaair-cli/master/install.sh -o "$RUNNER_TEMP/laya-install.sh"
          bash "$RUNNER_TEMP/laya-install.sh"
          echo "$HOME/.layaair" >> "$GITHUB_PATH"
          "$HOME/.layaair/layaair" install 3.4.0
          "$HOME/.layaair/layaair" list
      - name: Create official IDE project and configure real entry
        working-directory: private-game
        shell: bash
        run: |
          set -euo pipefail
          bash tools/create-laya-project.sh
          node tools/release/configure-entry.mjs
      - name: Retain official CLI no-render diagnostics for investigation
        working-directory: private-game
        shell: bash
        run: |
          mkdir -p qa-evidence/real-laya
          python3 - <<'PY'
          from pathlib import Path
          p=Path.home()/'.layaair/3.4.0/Resources/engine/libs/laya.no-render.js'
          if p.exists():
              lines=p.read_text().splitlines()
              selected=set(range(min(100,len(lines))))
              for i,line in enumerate(lines):
                  if any(k in line for k in ['class NoRenderStruct2D','class NoRender2DPass','class NoRenderPrimitiveDataHandle','inheriteRenderData']):
                      selected.update(range(max(0,i-5),min(len(lines),i+100)))
              (Path('qa-evidence/real-laya')/'cli-no-render-diagnostic.txt').write_text('\n'.join(f'{i+1}: {lines[i]}' for i in sorted(selected))+'\n')
          PY
      - name: Official CLI Web build and integrity checks
        working-directory: private-game
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          GITHUB_SHA="$SOURCE_COMMIT" npm run release:build
      - name: Record official engine bytes
        working-directory: private-game
        run: |
          mkdir -p qa-evidence/real-laya
          cp .release-out/web/_build-evidence.json qa-evidence/real-laya/official-build-manifest.json
          sha256sum .release-out/web/libs/*.js .release-out/web/js/index.js

      - name: Install Chromium QA dependencies
        shell: bash
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: 'Real SDK browser QA: active motion budget, core flow, Boss/rage/reward, deep extraction'
        working-directory: private-game
        shell: bash
        run: |
          COLD_GATE_STATUS=0
          GUNCAT_HEADED=1 xvfb-run -a -s '-screen 0 1920x1080x24' python tools/qa/cold-performance.py || COLD_GATE_STATUS=$?
          node tools/qa/render-profile.mjs
          GUNCAT_HEADED=1 xvfb-run -a -s '-screen 0 1920x1080x24' python tools/qa/render-profile.py
          test "$COLD_GATE_STATUS" -eq 0
          node tools/dev/build-baseline.mjs
          GUNCAT_HEADED=1 xvfb-run -a -s '-screen 0 1920x1080x24' python tools/qa/capture-baseline.py
          GUNCAT_HEADED=1 xvfb-run -a -s '-screen 0 1920x1080x24' npm run release:smoke
          GUNCAT_HEADED=1 xvfb-run -a -s '-screen 0 1920x1080x24' python tools/qa/animation-real.py
          GUNCAT_HEADED=1 xvfb-run -a -s '-screen 0 1920x1080x24' python tools/qa/enemies-real.py
          python tools/release/art-gallery.py
          npm run release:verify
      - name: Retain official SDK probe (no game source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guncat-official-sdk-probe
          path: |
            private-game/.release-out/web/libs/
            private-game/.release-out/web/js/index.js
            private-game/.release-out/web/_build-evidence.json
          if-no-files-found: error

      - name: Upload screenshot evidence (never upload source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guncat-real-laya-browser-qa
          path: private-game/qa-evidence/real-laya/
          if-no-files-found: error
      - name: Upload original PNGs and metrics for direct visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guncat-visual-review
          path: |
            private-game/qa-evidence/real-laya/*.png
            private-game/qa-evidence/real-laya/*.json
            private-game/qa-evidence/real-laya/*.webm
            private-game/qa-evidence/real-laya/before/performance.json
          if-no-files-found: error
          compression-level: 6
      - name: Export unretouched visual review
        if: always()
        working-directory: private-game
        run: |
          python -m pip install Pillow
          python tools/qa/review-contact.py
      - name: Upload verified WEB OUTPUT only to Pages
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          name: guncat-pages-${{ github.run_attempt }}
          path: private-game/.release-out/web
      - name: Deploy verified Web package to GitHub Pages
        if: success()
        id: publish
        uses: actions/deploy-pages@v4
        with:
          artifact_name: guncat-pages-${{ github.run_attempt }}
      - name: Verify deployed source and live runtime bytes
        if: success()
        working-directory: private-game
        run: |
          python - <<'PY'
          import hashlib,json,time,urllib.request
          from pathlib import Path
          local=json.loads(Path('.release-out/web/_build-evidence.json').read_text())
          base='https://baimagod.github.io/qiangshoumaomisoudache-preview/'
          version=local['sourceCommit']
          def fetch(path):
              with urllib.request.urlopen(base+path+'?verified='+version,timeout=45) as r:return r.read()
          for attempt in range(12):
              remote=json.loads(fetch('_build-evidence.json'))
              if remote['sourceCommit']==version:break
              time.sleep(5)
          else:raise AssertionError('Pages did not serve the accepted source commit')
          files={x['path']:x for x in local['files']}
          names=['index.html','js/index.js','js/guncat-game.js','assets/art/scene-floor.webp','assets/art/scene-water.webp','assets/art/bg-home.webp','assets/art/bg-workshop.webp','assets/art/frame-metal.webp','assets/art/frame-leather.webp','assets/art/button-gold.webp','art-review/index.html','art-review/acceptance-summary.json','assets/art/cat-walk.webp','assets/art/cat-walk-0.webp','assets/art/cat-walk-5.webp','art-review/animation-summary.json','art-review/battle-pistol-390x844.webm','art-review/battle-smg-390x844.webm','art-review/battle-shotgun-390x844.webm','assets/art/enemy-walk.webp','assets/art/rat-walk-0.webp','assets/art/rat-walk-1.webp','assets/art/rat-walk-2.webp','assets/art/rat-walk-3.webp','assets/art/dog-walk-0.webp','assets/art/dog-walk-1.webp','assets/art/dog-walk-2.webp','assets/art/dog-walk-3.webp','assets/art/crow-walk-0.webp','assets/art/crow-walk-1.webp','assets/art/crow-walk-2.webp','assets/art/crow-walk-3.webp','art-review/enemy-summary.json','art-review/battle-enemies-390x844.webm']
          for name in names:
              data=fetch(name)
              assert len(data)==files[name]['bytes'] and hashlib.sha256(data).hexdigest()==files[name]['sha256'],name
          print('LIVE_ACCEPTED_SOURCE',version)
          print('LIVE_ACCEPTED_FILE_HASHES',len(names))
          PY
