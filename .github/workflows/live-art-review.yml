name: Read-only live art audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/live-art-review.yml']
permissions:
  contents: read
concurrency:
  group: guncat-live-art-review
  cancel-in-progress: true
jobs:
  inspect-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install real browser and image review dependencies
        run: |
          python -m pip install Pillow playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify accepted live bytes and review phone and desktop
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24' python - <<'PY'
          import base64,hashlib,io,json,time,urllib.request,os
          from pathlib import Path
          from PIL import Image,ImageDraw
          from playwright.sync_api import sync_playwright
          base='https://baimagod.github.io/qiangshoumaomisoudache-preview/'
          expected='ae1c58f0f226f15d9d8420cc552a676269cac662'
          def fetch(name):
              req=urllib.request.Request(base+name+'?audit='+str(time.time_ns()),headers={'User-Agent':'GunCat-art-acceptance'})
              with urllib.request.urlopen(req,timeout=45) as r:return r.read()
          for attempt in range(24):
              manifest=json.loads(fetch('_build-evidence.json'))
              if manifest['sourceCommit']==expected:break
              time.sleep(5)
          else:raise AssertionError('Accepted source was not deployed')
          print('LIVE_ART_SOURCE',manifest['sourceCommit'],flush=True)
          assert manifest['verifiedSource']=='real-engine-not-qa-mock'
          files={x['path']:x for x in manifest['files']}
          names=['index.html','js/index.js','js/guncat-game.js','assets/art/scene-floor.webp','assets/art/scene-water.webp','assets/art/bg-home.webp','assets/art/bg-workshop.webp','assets/art/frame-metal.webp','assets/art/frame-leather.webp','assets/art/button-gold.webp','assets/art/cat-walk.webp',*[f'assets/art/cat-walk-{i}.webp' for i in range(6)],'art-review/animation-summary.json',*[f'art-review/battle-{gun}-390x844.webm' for gun in ['pistol','smg','shotgun']], 'assets/art/enemy-walk.webp', *[f'assets/art/{kind}-walk-{i}.webp' for kind in ['rat','dog','crow'] for i in range(4)],'art-review/enemy-summary.json','art-review/battle-enemies-390x844.webm']
          for name in names:
              data=fetch(name);assert len(data)==files[name]['bytes'];assert hashlib.sha256(data).hexdigest()==files[name]['sha256']
          print('LIVE_FILE_HASHES_VERIFIED',len(names),flush=True)
          out=Path('live-art-review');out.mkdir(exist_ok=True)
          pending=[]
          def emit(name,pic):
              pending.append((name,pic.copy()))
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=False,args=['--no-sandbox'])
              for w,h in [(375,667),(1440,900)]:
                  errors=[];page=browser.new_page(viewport={'width':w,'height':h},device_scale_factor=2)
                  page.on('pageerror',lambda err:errors.append(str(err)))
                  page.on('requestfailed',lambda req:errors.append(req.url))
                  page.on('console',lambda msg:errors.append(msg.text) if msg.type=='error' else None)
                  page.on('response',lambda res:errors.append(f'{res.status} {res.url}') if res.status>=400 else None)
                  page.goto(base+'?v='+expected,wait_until='networkidle',timeout=45000)
                  page.get_by_role('button',name='开始出击',exact=True).wait_for(timeout=20000)
                  shots=[]
                  def snap(name):
                      path=out/(name+'-'+str(w)+'x'+str(h)+'.png')
                      page.locator('#guncat-root').screenshot(path=str(path));shots.append((name,path))
                  snap('home')
                  page.get_by_role('button',name='永久强化',exact=True).click()
                  page.wait_for_function('() => [...document.images].every(i=>i.complete&&i.naturalWidth>0)')
                  snap('upgrades')
                  page.get_by_role('button',name='猫咪基地',exact=True).click()
                  page.get_by_role('button',name='开始出击',exact=True).click()
                  page.get_by_text('HP 100/100',exact=True).wait_for()
                  page.wait_for_timeout(300);snap('raid')
                  root_ui=page.locator('#guncat-root');motion_ui=page.locator('#guncat-motion-state')
                  before=float(root_ui.get_attribute('data-world-x'));page.keyboard.down('d')
                  frames=page.evaluate("""()=>new Promise(resolve=>{const frames=new Set();let n=0;function f(){frames.add(document.querySelector('#guncat-motion-state').dataset.actorArt);if(++n<75)requestAnimationFrame(f);else resolve([...frames]);}requestAnimationFrame(f);})""")
                  page.keyboard.up('d');assert set(f'cat-walk-{i}' for i in range(6))<=set(frames),frames
                  assert float(root_ui.get_attribute('data-world-x'))-before>70
                  page.wait_for_function("document.querySelector('#guncat-motion-state').dataset.actorState==='idle'")
                  snap('walk');print('LIVE_SIX_FRAME_WALK_PASS',w,h,frames,flush=True)
                  if w==1440:
                      path=out/'desktop-full.png';page.screenshot(path=str(path))
                      pic=Image.open(path);pic.thumbnail((1200,750),Image.Resampling.LANCZOS);emit('desktop-full',pic)
                  page.get_by_role('button',name='暂停',exact=True).click();page.wait_for_timeout(160);frozen=motion_ui.get_attribute('data-actor-art');xy=(root_ui.get_attribute('data-world-x'),root_ui.get_attribute('data-world-y'));page.wait_for_timeout(300);assert frozen==motion_ui.get_attribute('data-actor-art');assert xy==(root_ui.get_attribute('data-world-x'),root_ui.get_attribute('data-world-y'));snap('pause')
                  page.get_by_role('button',name='继续游戏',exact=True).click()
                  page.get_by_role('button',name='背包',exact=True).click();snap('bag')
                  assert page.locator('.gc-slot').count()==12
                  page.get_by_role('button',name='关闭背包',exact=True).click()
                  page.get_by_role('button',name='暂停',exact=True).click()
                  page.once('dialog',lambda d:d.accept())
                  page.get_by_role('button',name='主动放弃',exact=True).click()
                  page.get_by_role('button',name='返回基地',exact=True).click()
                  page.evaluate("""()=>{const key='guncat.profile.v1',p=JSON.parse(localStorage.getItem(key));if(!p||p.activeRaidId)throw Error('Expected base');p.unlockedWeaponIds=['pistol','smg','shotgun'];p.equippedWeaponId='shotgun';p.revision++;localStorage.setItem(key,JSON.stringify(p));}""")
                  page.reload(wait_until='networkidle')
                  page.get_by_role('button',name='开始出击',exact=True).click()
                  assert root_ui.get_attribute('data-world-art-ready')=='63'
                  assert root_ui.get_attribute('data-enemy-atlas-frames')=='12'
                  walking_captured=False
                  def move(axis,target):
                      global walking_captured
                      for _ in range(180):
                          gap=target-float(root_ui.get_attribute('data-world-'+axis))
                          if abs(gap)<18:return
                          key=('d' if gap>0 else 'a') if axis=='x' else ('s' if gap>0 else 'w')
                          page.keyboard.down(key);page.wait_for_timeout(min(90,max(30,abs(gap)*1.2)));page.keyboard.up(key);page.wait_for_timeout(20)
                          if not walking_captured and '-walk-' in motion_ui.get_attribute('data-enemy-frames'):
                              snap('enemy-walk');walking_captured=True
                      raise AssertionError('Live route blocked')
                  for axis,target in [('x',1050),('y',1480),('x',1190),('y',1320),('x',880),('y',930)]:move(axis,target)
                  page.wait_for_timeout(2200)
                  move('x',600)
                  page.wait_for_timeout(160)
                  enemy_frames=json.loads(motion_ui.get_attribute('data-enemy-frames'))
                  assert set(f'{kind}-walk-{i}' for kind in ['rat','dog','crow'] for i in range(4))<=set(enemy_frames),enemy_frames
                  assert int(motion_ui.get_attribute('data-enemy-hits'))>0
                  assert int(motion_ui.get_attribute('data-enemy-defeats'))>=4
                  assert int(motion_ui.get_attribute('data-enemy-defeats'))==int(root_ui.get_attribute('data-kill-count'))
                  snap('enemy-combat')
                  print('LIVE_TWELVE_ENEMY_FRAMES_AND_REAL_HITS_PASS',w,h,enemy_frames,flush=True)
                  assert not errors,errors
                  sheet=Image.new('RGB',(880,500*((len(shots)+3)//4)),'#102b32');draw=ImageDraw.Draw(sheet)
                  for i,(name,path) in enumerate(shots):
                      pic=Image.open(path).convert('RGB');pic.thumbnail((210,460),Image.Resampling.LANCZOS)
                      sheet.paste(pic,((i%4)*220+5,(i//4)*500+25));draw.text(((i%4)*220+5,(i//4)*500+5),name,fill='#ffe3a4')
                  emit(str(w)+'x'+str(h)+'-live',sheet)
                  print('LIVE_VIEWPORT_REVIEW',w,h,page.locator('#guncat-root').bounding_box(),flush=True)
                  page.close()
              browser.close()
          (out/'live-audit.json').write_text(json.dumps({'source':expected,'filesVerified':len(names),'viewports':['375x667','1440x900'],'sixFrameWalk':True,'pauseAndBag':True,'enemyFrames':12,'trueHitsAndDefeats':True,'errors':0},indent=2)+'\n')
          for name,pic in pending:pic.save(out/(name+'-contact.png'))
          PY
      - name: Retain original live screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guncat-live-art-review
          path: live-art-review/
          if-no-files-found: error
